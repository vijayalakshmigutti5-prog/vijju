<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Modern Image Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f172a;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --gray-text: #64748b;
            --border-color: #e2e8f0;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header Section --- */
        header {
            background: var(--white);
            padding: 2.5rem 5% 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        header p {
            color: var(--gray-text);
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto 1.5rem;
        }

        /* --- Filter Navigation Buttons --- */
        .filter-nav {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .filter-btn {
            background: var(--white);
            border: 1px solid var(--border-color);
            color: var(--gray-text);
            padding: 0.5rem 1.25rem;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: var(--white);
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        /* --- Gallery Grid Layout --- */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 5%;
            flex-grow: 1;
            width: 100%;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .gallery-item {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            opacity: 1;
            transform: scale(1);
        }

        .gallery-item.hide {
            display: none;
        }

        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.08), 0 10px 10px -5px rgba(0,0,0,0.04);
            border-color: #cbd5e1;
        }

        .img-wrapper {
            position: relative;
            height: 240px;
            overflow: hidden;
            background: #f1f5f9;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .gallery-item:hover .img-wrapper img {
            transform: scale(1.08);
        }

        .img-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition);
        }

        .img-overlay i {
            color: var(--white);
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 50%;
            backdrop-filter: blur(4px);
            transform: scale(0.8);
            transition: var(--transition);
        }

        .gallery-item:hover .img-overlay {
            opacity: 1;
        }

        .gallery-item:hover .img-overlay i {
            transform: scale(1);
        }

        .item-details {
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
        }

        .item-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #e0e7ff;
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* --- Lightbox Modal Overlay --- */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            padding: 2rem;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            position: relative;
            max-width: 900px;
            width: 100%;
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: var(--transition);
        }

        .lightbox.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox-content img {
            width: 100%;
            max-height: 60vh;
            object-fit: cover;
            display: block;
        }

        .lightbox-info {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
        }

        .lightbox-info h3 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .lightbox-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: var(--white);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .lightbox-close:hover {
            background: var(--accent);
        }

        /* --- Footer --- */
        footer {
            background: var(--white);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 1.5rem;
            color: var(--gray-text);
            font-size: 0.9rem;
        }

        /* Responsive Breakpoints */
        @media(max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Lumina Gallery</h1>
        <p>Explore a curated visual collection of breathtaking landscapes, modern architecture, and wild nature.</p>
        
        <div class="filter-nav">
            <button class="filter-btn active" data-filter="all">All Photos</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="architecture">Architecture</button>
            <button class="filter-btn" data-filter="animals">Animals</button>
            <button class="filter-btn" data-filter="travel">Travel</button>
        </div>
    </header>

    <main class="gallery-container">
        <div class="gallery-grid" id="gallery-grid">
            </div>
    </main>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightbox-close">&times;</button>
            <img src="" alt="Enlarged View" id="lightbox-img">
            <div class="lightbox-info">
                <h3 id="lightbox-title">Image Title</h3>
                <span class="item-category" id="lightbox-category">Category</span>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Lumina Gallery App. Built with HTML, CSS, and JavaScript.</p>
    </footer>

    <script>
        // Comprehensive Gallery Dataset with 12+ high-res Unsplash items
        const galleryData = [
            {
                id: 1,
                title: "Misty Pine Forest",
                category: "nature",
                image: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&q=80&w=900"
            },
            {
                id: 2,
                title: "Minimalist Concrete Structure",
                category: "architecture",
                image: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&q=80&w=900"
            },
            {
                id: 3,
                title: "Majestic Snow Mountain",
                category: "nature",
                image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=900"
            },
            {
                id: 4,
                title: "Golden Hour Lion",
                category: "animals",
                image: "https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&q=80&w=900"
            },
            {
                id: 5,
                title: "Venice Canal Waters",
                category: "travel",
                image: "https://images.unsplash.com/photo-1514896856501-4fec385e81af?auto=format&fit=crop&q=80&w=900"
            },
            {
                id: 6,
                title: "Modern Glass Skyscraper",
                category: "architecture",
                image: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80&w=900"
            },
            {
                id: 7,
                title: "Curious Red Fox",
                category: "animals",
                image: "https://images.unsplash.com/photo-1516934024545-ac69ab79188e?auto=format&fit=crop&q=80&w=900"
            },
            {
                id: 8,
                title: "Tropical Beach Sunset",
                category: "travel",
                image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=900"
            },
            {
                id: 9,
                title: "Abstract Spiral Staircase",
                category: "architecture",
                image: "https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?auto=format&fit=crop&q=80&w=900"
            },
            {
                id: 10,
                title: "Autumn Leaf Canopy",
                category: "nature",
                image: "https://images.unsplash.com/photo-1507783590521-72f53443e620?auto=format&fit=crop&q=80&w=900"
            },
            {
                id: 11,
                title: "Kyoto Bamboo Forest",
                category: "travel",
                image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&q=80&w=900"
            },
            {
                id: 12,
                title: "Majestic Owl Portrait",
                category: "animals",
                image: "https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&q=80&w=900"
            }
        ];

        const galleryGrid = document.getElementById('gallery-grid');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxTitle = document.getElementById('lightbox-title');
        const lightboxCategory = document.getElementById('lightbox-category');
        const lightboxClose = document.getElementById('lightbox-close');

        // Render Gallery Items
        function renderGallery(items) {
            galleryGrid.innerHTML = items.map(item => `
                <div class="gallery-item" data-category="${item.category}" onclick="openLightbox('${item.image}', '${item.title}', '${item.category}')">
                    <div class="img-wrapper">
                        <img src="${item.image}" alt="${item.title}" loading="lazy">
                        <div class="img-overlay">
                            <i class="fa-solid fa-expand"></i>
                        </div>
                    </div>
                    <div class="item-details">
                        <span class="item-title">${item.title}</span>
                        <span class="item-category">${item.category}</span>
                    </div>
                </div>
            `).join('');
        }

        // Filtering Logic
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Toggle active class on buttons
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filterValue = btn.getAttribute('data-filter');

                if (filterValue === 'all') {
                    renderGallery(galleryData);
                } else {
                    const filtered = galleryData.filter(item => item.category === filterValue);
                    renderGallery(filtered);
                }
            });
        });

        // Lightbox Popup Control
        function openLightbox(imgSrc, title, category) {
            lightboxImg.src = imgSrc;
            lightboxTitle.innerText = title;
            lightboxCategory.innerText = category;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        // Initial Load
        window.onload = () => {
            renderGallery(galleryData);
        };
    </script>
</body>
</html>
